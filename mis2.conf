server {
    listen 448 ssl;
    http2 on;
    server_name mis2.lby.co.nz;
    # SSL证书配置（从default.conf迁移至此）
    ssl_certificate     /etc/nginx/cert/lby.co.nz.cert.pem;
    ssl_certificate_key /etc/nginx/cert/lby.co.nz.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 客户端请求大小限制
    client_max_body_size 1000M;
    
    root /var/www/mis2/public;

    # WebSocket
    location ^~ /ws/ {
        access_log /var/log/nginx/ws_debug.log;
        proxy_pass http://127.0.0.1:8031/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ===============================
    # 后端接口（ThinkPHP 多应用，/admin 与 /api 为应用名）
    # proxy_pass 不带 URI（无尾部斜杠）= 不剥前缀，浏览器 URL 与后端路径 1:1
    # 前端请求：/admin/...（admin 应用）、/api/...（api 应用），dev 与生产一致
    # ===============================
    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ===============================
    # 上传文件静态资源 - 历史遗留裸文件名
    # Forguncy 迁移数据：DB 存裸文件名（guid_xxx.jpg），文件在 Upload 目录根部
    # /storage/xxx.jpg（无子目录）→ /opt/ForguncySites/ForguncyServer/lbymis/Upload/xxx.jpg
    # 注：正则 location 优先于普通前缀 location，须置于下方 /storage/ 前缀之前生效
    # ===============================
    location ~* ^/storage/([^/]+)\.(jpg|jpeg|png|gif|pdf|webp|bmp|svg|svgz|ico|xlsx|xls|docx|doc|zip|rar|7z|csv|txt|mp4|mp3|wav)$ {
        alias /opt/ForguncySites/ForguncyServer/lbymis/Upload/$1.$2;

        # CORS - pdf.js 等以 fetch 方式读取文件，本地开发跨域必须携带
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, batoken, Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, batoken, Range";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        types {
            application/pdf  pdf;
            image/jpeg       jpg jpeg;
            image/png        png;
            image/gif        gif;
            image/webp       webp;
            image/bmp        bmp;
            image/svg+xml    svg svgz;
            image/x-icon     ico;
        }
        default_type application/octet-stream;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ===============================
    # 上传文件静态资源 - 本系统新上传
    # ThinkPHP public 磁盘：/storage/{topic}/日期/xxx.jpg
    # → /var/www/mis2/public/storage/{topic}/日期/xxx.jpg
    # ===============================
    location /storage/ {
        alias /var/www/mis2/public/storage/;

        # CORS - 允许本地开发跨域 (localhost:xxxx)
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, batoken, Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, batoken, Range";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        types {
            application/pdf  pdf;
            image/jpeg       jpg jpeg;
            image/png        png;
            image/gif        gif;
            image/webp       webp;
            image/bmp        bmp;
            image/svg+xml    svg svgz;
            image/x-icon     ico;
        }
        default_type application/octet-stream;

        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;

        # 安全：禁止脚本执行
        location ~* \.(php|php5|phtml|jsp|sh|cgi|pl|py|asp|aspx)$ {
            deny all;
        }
    }

    # ===============================
    # 🔥 前端缓存策略（关键）
    # ===============================

    # 1. 禁用 index.html 缓存（确保更新生效）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. 对 assets/ 使用永久缓存（Vite hash 文件安全）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. 其他 js/css 也长缓存（如没有 hash 可移除）
    location ~* \.(js|css|mjs)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ===============================
    # Vue3 SPA 路由支持
    # 接口已由上方 ^~ /admin/、^~ /api/ 直转 Workerman，此处仅服务前端静态资源
    # ===============================
    location / {
        index index.html error/index.html;

        try_files $uri $uri/ /index.html;
    }

    location ~* \.mjs$ {
    	add_header Content-Type application/javascript;
    }
}


server {
    listen 80;
    server_name mis2.lby.co.nz;
    # 重定向必须保留 URI：协议相对 URL（//host/...）在 http 页面下会解析为 http，
    # 若重定向丢失路径（如 301 到首页），图片等资源将加载失败
    # CORS：pdf.js 等以 fetch 读取的跨域请求遇到 http→https 跨源重定向时，
    # 重定向响应本身也必须携带 CORS 头，否则请求在重定向处被浏览器阻断
    add_header Access-Control-Allow-Origin "*" always;
    return 301 https://$host$request_uri;
}

server {
    listen 8080;
    server_name mis2.lby.co.nz;
    return 301 https://$host$request_uri;
}
